name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Gradle project files
        shell: bash
        run: |
          if [[ ! -f settings.gradle.kts && ! -f settings.gradle && ! -f build.gradle.kts && ! -f build.gradle ]]; then
            echo "::error::No Gradle project found at the repository root."
            echo "Upload the contents of this project ZIP to the repository root."
            find . -maxdepth 3 -type f | sort
            exit 1
          fi
          test -f settings.gradle.kts || test -f settings.gradle
          test -f app/build.gradle.kts || test -f app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-island-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
