name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Locate and extract Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted-project

          if [[ -f settings.gradle.kts || -f settings.gradle ]]; then
            echo "Gradle project already exists at repository root."
            echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
            exit 0
          fi

          ZIP_FILE=""
          for candidate in DynamicIsland-fixed.zip "DynamicIsland (2).zip" ./*.zip; do
            if [[ -f "$candidate" ]]; then
              ZIP_FILE="$candidate"
              break
            fi
          done

          if [[ -z "$ZIP_FILE" ]]; then
            echo "::error::No Gradle project or project ZIP found in repository root."
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Extracting $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted-project

          PROJECT_SETTINGS="$(find extracted-project -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)"
          if [[ -z "$PROJECT_SETTINGS" ]]; then
            echo "::error::The ZIP does not contain settings.gradle(.kts)."
            find extracted-project -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_SETTINGS")"
          if [[ ! -f "$PROJECT_DIR/app/build.gradle.kts" && ! -f "$PROJECT_DIR/app/build.gradle" ]]; then
            echo "::error::The extracted project has no app Gradle build file."
            find "$PROJECT_DIR" -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project directory: $PROJECT_DIR"

      - name: Build debug APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-island-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
